[project]
name = "pycon-mre"
version = "0.1.0"
project = false
description = "Demonstration project for my PyConFR 2026 talk"
readme = "README.md"
authors = [
    { name = "Loïc Simon", email = "loic.simon@napta.io" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.0",
    "comdab>=0.4.1",
    "psycopg2>=2.9.13",
    "sqlalchemy>=2.1.4",
]

[tool.ruff]
line-length=120

[tool.alembic]
script_location = "%(here)s/app/alembic"
prepend_sys_path = ["."]
